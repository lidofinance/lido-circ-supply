name: Check LDO events snapshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/tokens/ldo/**'
      - 'src/common/provider/**'
      - 'scripts/ldo-snapshot.ts'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Check snapshot against chain
        run: yarn ldo-snapshot:check
        env:
          EL_API_URLS: ${{ secrets.MAINNET_RPC_URL }}
